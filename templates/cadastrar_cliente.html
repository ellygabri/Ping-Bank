{% extends "base.html" %}


{% block conteudo %}

<section class="titulo-pagina">

    <h2>Cadastrar cliente</h2>

    <p>
        Informe os dados do novo cliente.
    </p>

</section>

{% if mensagem %}

    <div class="mensagem">
        {{ mensagem }}
    </div>

{% endif %}

<section class="formulario-container">

    <form method="post" class="formulario">

        <div class="grupo-formulario">

            <label for="nome">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                required
            >

        </div>

        <div class="grupo-formulario">

            <label for="cpf">
                CPF
            </label>

            <input
                type="text"
                id="cpf"
                name="cpf"
                placeholder="000.000.000-00"
                required
            >

        </div>

        <div class="grupo-formulario">

            <label for="contato">
                Contato
            </label>

            <input
                type="text"
                id="contato"
                name="contato"
                required
            >

        </div>

        <div class="grupo-formulario">

            <label for="endereco">
                Endereço
            </label>

            <input
                type="text"
                id="endereco"
                name="endereco"
                required
            >

        </div>

        <div class="grupo-formulario">

            <label for="data_nascimento">
                Data de nascimento
            </label>

            <input
                type="text"
                id="data_nascimento"
                name="data_nascimento"
                placeholder="dd/mm/aaaa"
                required
            >

        </div>

        <div class="grupo-formulario">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >

        </div>


        <div class="acoes-formulario">

            <button
                type="submit" class="botao">

                Cadastrar
            </button>

            <a
                href="{{ url_for('pagina_clientes') }}" class="botao botao-secundario">
                Voltar
            </a>
        </div>
    </form>

</section>

{% endblock %}
