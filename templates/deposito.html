{% extends "base.html" %}

{% block conteudo %}

<section class = "titulo-pagina">

    <h2> Depósito </h2>

    <p>
        Informe os dados da conta e o valor do depósito.
    </p>
</section>

{% if mensagem %}

<div class = "mensagem">
    {{mensagem}}
</div>

{% endif %}

<section class = "formulario-container">

    <form method = "post" class = "formulario">

        <div class = "grupo-formulario">

            <label for = "num_conta">
                Número da conta
            </label>

            <input type = "number" id = "num_conta" name = "num_conta" required>
        </div>

        <div class = "grupo-formulario">

            <label for = "valor">
                Valor do depósito
            </label>

            <input
                type = "number"
                id = "valor"
                name = "valor"
                step = "0.01"
                required
            >
        </div>

        <div class = "acoes-formulario">

            <button type = "submit" class = "botao">
                Depositar
            </button>

            <a href = "{{url_for('pagina_operacoes')}}" class = "botao botao-secundario">
                Voltar
            </a>
        </div>
    </form>
</section>

{% endblock %}
