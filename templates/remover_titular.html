{% extends "base.html" %}

{% block conteudo %}

<section class = "titulo-pagina">

    <h2> Remover titular </h2>

    <p>
        Remova um titular de uma conta existente.
    </p>
</section>

{% if mensagem %}

<div class = "mensagem">
    {{mensagem}}
</div>

{% endif %}

<section class = "formulario-container">

    <form method = "post" class = "formulario">

        <div class = "grupo-formulario">

            <label for = "num_conta">
                Número da conta
            </label>

            <input
                type = "number"
                id = "num_conta"
                name = "num_conta"
                required
            >
        </div>

        <div class = "grupo-formulario">

            <label for = "num_agencia">
                Número da agência
            </label>

            <input
                type = "text"
                id = "num_agencia"
                name = "num_agencia"
                required
            >
        </div>

        <div class = "grupo-formulario">

            <label for = "cpf_validacao">
                CPF de um titular atual
            </label>

            <input
                type = "text"
                id = "cpf_validacao"
                name = "cpf_validacao"
                required
            >
        </div>

        <div class = "grupo-formulario">

            <label for = "titular_removido">
                CPF do titular que será removido
            </label>

            <input
                type = "text"
                id = "titular_removido"
                name = "titular_removido"
                required
            >
        </div>

        <div class = "acoes-formulario">

            <button type = "submit" class = "botao botao-perigo">
                Remover
            </button>

            <a href = "{{url_for('pagina_contas')}}" class = "botao botao-secundario">
                Voltar
            </a>

        </div>
    </form>
</section>

{% endblock %}
