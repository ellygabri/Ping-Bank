{% extends "base.html" %}

{% block conteudo %}

<section class = "titulo-pagina">

    <h2> Excluir conta </h2>

    <p>
        Informe os dados da conta e um CPF autorizado.
    </p>
</section>

{% if mensagem %}

<div class = "mensagem">
    {{mensagem}}
</div>

{% endif %}

<section class = "formulario-container">

    <form method = "post" class = "formulario">

        <div class = "grupo-formulario">

            <label for = "num_conta">
                Número da conta
            </label>

            <input
                type = "number"
                id = "num_conta"
                name = "num_conta"
                required
            >
        </div>

        <div class = "grupo-formulario">

            <label for = "num_agencia">
                Número da agência
            </label>

            <input
                type = "text"
                id = "num_agencia"
                name = "num_agencia"
                required
            >
        </div>

        <div class = "grupo-formulario">

            <label for = "cpf">
                CPF de um titular
            </label>

            <input
                type = "text"
                id = "cpf"
                name = "cpf"
                required
            >
        </div>

        <div class = "acoes-formulario">

            <button type = "submit" class = "botao botao-perigo">
                Excluir conta
            </button>

            <a href = "{{url_for('pagina_contas')}}" class = "botao botao-secundario">
                Voltar
            </a>
        </div>
    </form>
</section>

{% endblock %}
