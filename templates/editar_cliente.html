{% extends "base.html" %}

{% block conteudo %}

<section class="titulo-pagina">

    <h2>Editar cliente</h2>

    <p>
        Atualize os dados cadastrados.
    </p>

</section>

{% if mensagem %}

    <div class="mensagem">
        {{ mensagem }}
    </div>

{% endif %}

<section class="formulario-container">

    <form method="post" class="formulario">

        <div class="grupo-formulario">

            <label>
                CPF
            </label>

            <input
                type="text"
                value="{{ cliente.cpf }}"
                disabled
            >

        </div>

        <div class="grupo-formulario">

            <label for="nome">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                value="{{ cliente.nome }}"
                required
            >

        </div>

        <div class="grupo-formulario">

            <label for="contato">
                Contato
            </label>

            <input
                type="text"
                id="contato"
                name="contato"
                value="{{ cliente.contato }}"
                required
            >

        </div>

        <div class="grupo-formulario">

            <label for="endereco">
                Endereço
            </label>

            <input
                type="text"
                id="endereco"
                name="endereco"
                value="{{ cliente.endereco }}"
                required
            >

        </div>

        <div class="grupo-formulario">

            <label for="data_nascimento">
                Data de nascimento
            </label>

            <input
                type="text"
                id="data_nascimento"
                name="data_nascimento"
                value="{{ cliente.data_nascimento }}"
                required
            >

        </div>

        <div class="grupo-formulario">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                name="email"
                value="{{ cliente.email }}"
                required
            >

        </div>

        <div class="acoes-formulario">

            <button
                type="submit"
                class="botao"
            >
                Salvar alterações
            </button>

            <a href="{{ url_for('pagina_clientes') }}" class="botao botao-secundario">
                Cancelar
            </a>

        </div>
    </form>

</section>

{% endblock %}
